spring.application.name=Backend
spring.datasource.url=jdbc:mysql://localhost:3306/banik
spring.datasource.username=root
spring.datasource.password=mysql123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Bind to all network interfaces so the API is reachable from phones on the same Wi-Fi
server.address=0.0.0.0
server.port=8080

# Comma-separated list of allowed frontend origins. Override via env var APP_CORS_ALLOWED_ORIGINS
# e.g. http://localhost:5173,http://192.168.1.20:5173
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://10.15.8.86:5173}

# JWT
app.jwt.secret=${APP_JWT_SECRET:change-this-to-a-long-random-secret-in-production-min-256-bits}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# Default admin seed account (change password after first login)
app.admin.default-username=admin
app.admin.default-password=${APP_ADMIN_DEFAULT_PASSWORD:admin123}

# File uploads
app.upload.dir=${APP_UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# Email microservice (Node.js + Nodemailer)
app.email-service.base-url=${APP_EMAIL_SERVICE_URL:http://10.15.8.86:4000}
